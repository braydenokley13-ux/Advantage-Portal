# Free Writers League overdue scheduler.
#
# The primary schedule is the Vercel cron in vercel.json (08:00 UTC daily). On
# Vercel Hobby that's the only daily slot, and a single run can slip — this
# GitHub Actions workflow is a free hourly backstop. The endpoint de-dupes per
# day (reminder_sent_at / escalation_sent_at / urgent_escalation_sent_at), so a
# repeated or late run never double-sends.
#
# Setup (Repo → Settings → Secrets and variables → Actions):
#   LEAGUE_OVERDUE_URL = https://<your-app>/api/cron/league-overdue
#   CRON_SECRET        = the same value set in the app environment
#
# The job no-ops (and does not fail) when the secrets are absent, so forks and
# unconfigured clones stay green.
name: League overdue scan

on:
  schedule:
    # Top of every hour (UTC). The endpoint de-dupes, so extra runs are safe.
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: league-overdue
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger league overdue scan
        env:
          LEAGUE_OVERDUE_URL: ${{ secrets.LEAGUE_OVERDUE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$LEAGUE_OVERDUE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "LEAGUE_OVERDUE_URL / CRON_SECRET not configured — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$LEAGUE_OVERDUE_URL")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          if [ "$code" -ge 400 ]; then
            echo "::error::League overdue endpoint returned HTTP $code"
            exit 1
          fi
